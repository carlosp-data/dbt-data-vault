name: tasty_bytes

profile: tasty_bytes

analysis-paths: ["analyses"]
macro-paths: ["macros"]
model-paths: ["models"]
seed-paths: ["seeds"]

clean-targets:
  - "dbt_packages"
  - "logs"
  - "target"

vars:
  # Load timestamp of vault inserts (format 'YYYY-MM-DD HH24:MI:SS').
  # null = start time of the dbt invocation. Set it with --vars to simulate a load.
  load_dts: null

seeds:
  # Builds seeds as tables in '<your_schema_name>_stg'
  tasty_bytes:
    +schema: stg

models:
  tasty_bytes:
    +static_analysis: strict
    # schema and materialization for each component
    staging:
      +schema: stg
      +materialized: view
    datavault:
      +schema: vault
      # insert-only: the loading macros select only new keys and changed rows
      +materialized: incremental
      +incremental_strategy: append
      # stop when the columns differ from the existing table; rebuild with --full-refresh
      +on_schema_change: fail
    marts:
      +schema: marts
      +materialized: table
