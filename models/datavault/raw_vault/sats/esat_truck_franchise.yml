version: 2

models:
  - name: esat_truck_franchise
    description: >
      Effectivity satellite on `lnk_truck_franchise`, driven by the truck: it records when a
      truck ↔ franchise pair becomes active or inactive. When a truck is transferred to another
      franchise, the load inserts the new pair as active and the old pair as inactive. The latest
      row of each pair gives its current status, and a truck has at most one active pair. A
      transfer is independent of a rebrand (`esat_truck_menu_type`), since franchises run trucks
      of several brands. Grain: (`truck_franchise_hk`, `load_dts`). A truck missing from a load
      keeps its current franchise. No ghost record (links and their effectivity satellites have
      none). Loaded from `stg_raw__trucks`. Insert-only, built with the `eff_sat` macro.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['truck_franchise_hk', 'load_dts']
    columns:
      - name: truck_franchise_hk
        description: Hash key of the parent link row (truck ↔ franchise pair).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('lnk_truck_franchise')
                field: truck_franchise_hk
      - name: load_dts
        description: Load timestamp of the batch that recorded the status change.
        data_tests:
          - not_null
      - name: is_active
        description: True from this load on when the pair is the franchise currently operating the truck, false when it stopped being current.
        data_tests:
          - not_null
      - name: record_source
        description: Source table that reported the status change.
        data_tests:
          - not_null
