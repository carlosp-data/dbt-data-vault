version: 2

models:
  - name: lnk_order_truck_location_customer_shift
    description: >
      Link of an order with the truck, location, loyalty customer and shift where it was placed,
      one row per order (the order is the unit of work). Grain:
      `order_truck_location_customer_shift_hk` (primary key). Anonymous orders (about 95%) link
      to the ghost customer, whose all-zeros key `hash_key()` returns for a NULL `customer_id`.
      Loaded from `stg_raw__orders_header`. Insert-only, built with the `link` macro on the
      `compute_big` warehouse.
    columns:
      - name: order_truck_location_customer_shift_hk
        description: Link hash key of (`customer_id`, `location_id`, `order_id`, `shift_id`, `truck_id`).
        data_tests:
          - unique
          - not_null
      - name: order_hk
        description: Hash key of the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('hub_order')
                field: order_hk
      - name: truck_hk
        description: Hash key of the truck that took the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('hub_truck')
                field: truck_hk
      - name: location_hk
        description: Hash key of the location where the order was placed.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('hub_location')
                field: location_hk
      - name: customer_hk
        description: Hash key of the loyalty customer. All zeros (ghost customer) for anonymous orders.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('hub_customer')
                field: customer_hk
      - name: shift_hk
        description: Hash key of the truck shift.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('hub_shift')
                field: shift_hk
      - name: load_dts
        description: Load timestamp of the batch that first saw the order.
        data_tests:
          - not_null
      - name: record_source
        description: Source table of the first row loaded for the relationship.
        data_tests:
          - not_null
