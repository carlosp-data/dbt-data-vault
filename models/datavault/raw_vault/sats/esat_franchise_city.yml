version: 2

models:
  - name: esat_franchise_city
    description: >
      Effectivity satellite on `lnk_franchise_city`, driven by the franchise: it records when a
      franchise ↔ city pair becomes active or inactive. When a franchise moves, the load inserts
      the new pair as active and the old pair as inactive. The latest row of each pair gives its
      current status, and a franchise has at most one active pair, because `stg_raw__franchises`
      keeps one city per franchise. Grain: (`franchise_city_hk`, `load_dts`). A franchise
      missing from a load keeps its current city. No ghost record (links and their effectivity
      satellites have none). Loaded from `stg_raw__franchises`. Insert-only, built with the
      `eff_sat` macro.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['franchise_city_hk', 'load_dts']
    columns:
      - name: franchise_city_hk
        description: Hash key of the parent link row (franchise ↔ city pair).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('lnk_franchise_city')
                field: franchise_city_hk
      - name: load_dts
        description: Load timestamp of the batch that recorded the status change.
        data_tests:
          - not_null
      - name: is_active
        description: True from this load on when the pair is the franchise's current city, false when it stopped being current.
        data_tests:
          - not_null
      - name: record_source
        description: Source table that reported the status change.
        data_tests:
          - not_null
