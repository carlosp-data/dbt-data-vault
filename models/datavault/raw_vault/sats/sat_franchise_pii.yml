version: 2

models:
  - name: sat_franchise_pii
    description: >
      Personal data (PII) of the franchisee who owns each franchise. It is the only franchise
      satellite: its cities are in `lnk_franchise_city`. One row per franchise and change,
      although staging repeats each franchise once per city (the PII is identical on those rows).
      Grain: (`franchise_hk`, `load_dts`). Loaded from `stg_raw__franchises`. Insert-only, built
      with the `sat` macro. Includes the ghost record (NULL payload).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['franchise_hk', 'load_dts']
    columns:
      - name: franchise_hk
        description: Hash key of the parent franchise. All zeros for the ghost record.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('hub_franchise')
                field: franchise_hk
      - name: load_dts
        description: Load timestamp of the batch that inserted this version. 1900-01-01 for the ghost record.
        data_tests:
          - not_null
      - name: franchise_pii_hashdiff
        description: Hashdiff over the payload columns. All zeros for the ghost record.
        data_tests:
          - not_null
      - name: franchise_first_name
        description: First name of the franchisee (PII).
      - name: franchise_last_name
        description: Last name of the franchisee (PII).
      - name: franchise_email
        description: Email address of the franchisee (PII).
      - name: franchise_phone
        description: Phone number of the franchisee (PII).
      - name: record_source
        description: Source table of this version. 'SYSTEM' for the ghost record.
        data_tests:
          - not_null
