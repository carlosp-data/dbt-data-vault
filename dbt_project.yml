name: tasty_bytes

profile: tasty_bytes

analysis-paths: ["analyses"]
macro-paths: ["macros"]
model-paths: ["models"]
seed-paths: ["seeds"]

clean-targets:
  - "dbt_packages"
  - "logs"
  - "target"

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  tasty_bytes:
    +schema: stg

models:
  tasty_bytes:
    +static_analysis: strict
    # Materialize staging models as views, and marts as tables
    staging:
      +schema: stg
      +materialized: view
    datavault:
      +schema: vault
      +materialized: incremental
    marts:
      +schema: marts
      +materialized: table
