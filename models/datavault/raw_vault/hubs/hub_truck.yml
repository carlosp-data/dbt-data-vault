version: 2

models:
  - name: hub_truck
    description: >
      Hub of food trucks, one row per truck. Grain: `truck_hk` (primary key), the hash of the
      business key `truck_id`. Loaded from `stg_raw__trucks`. Includes the ghost record.
      Insert-only, built with the `hub` macro.
    columns:
      - name: truck_hk
        description: Hash key of `truck_id`. All zeros for the ghost record, the key `hash_key()` returns for a NULL business key.
        data_tests:
          - unique
          - not_null
      - name: truck_id
        description: Business key of the truck. NULL for the ghost record.
        data_tests:
          - unique
          - not_null:
              config:
                where: "record_source != 'SYSTEM'"
      - name: load_dts
        description: Load timestamp of the batch that first saw the truck. 1900-01-01 for the ghost record.
        data_tests:
          - not_null
      - name: record_source
        description: Source table of the first row loaded for the truck. 'SYSTEM' for the ghost record.
        data_tests:
          - not_null
