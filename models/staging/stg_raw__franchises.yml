version: 2

models:
  - name: stg_raw__franchises
    description: >
      Franchises that operate Tasty Bytes food trucks, one row per source row: one per franchise
      and city it operates in, plus exact duplicates. Grain: the source row (no unique key).
      `franchise_id` is not unique: a franchise has no single main city. The source lists 5
      franchises (36, 37, 49, 81, 123) twice with different cities, and each runs one truck in
      each of its two cities; every other franchisee's city is the primary city of all its
      trucks. 5 more ids (332-336) are exact duplicates. They are not removed here: the vault
      macros deduplicate (`hub` and `link` keep one row per key, `sat` loads distinct rows). The
      franchisee's PII is the same on every row of a franchise, so `sat_franchise_pii` gets one
      row per franchise.
      Franchise 1 is Tasty Bytes itself and owns every company-operated truck.
      City and country are the business key of `hub_city`, so the only satellite payload left
      is the franchisee's PII.
      Feeds `hub_franchise`, `hub_city`, `lnk_franchise_city` and `sat_franchise_pii`.
    columns:
      - name: franchise_hk
        description: Hash key of the franchise business key (`franchise_id`). Repeated once per city of the franchise.
        data_tests:
          - not_null
      - name: city_hk
        description: >
          Hash key of the city business key (`city`, `country`). The city concept is shared with
          customers, locations and trucks and lives in its own hub.
        data_tests:
          - not_null
      - name: franchise_city_hk
        description: Link hash key of (`city`, `country`, `franchise_id`). Repeated on the exact duplicate rows of the source.
        data_tests:
          - not_null
      - name: franchise_id
        description: Business key of the franchise. Repeated once per city of the franchise.
        data_tests:
          - not_null
      - name: city
        description: A city where the franchise operates. Part of the `hub_city` business key.
        data_tests:
          - not_null
      - name: country
        description: Country of that city. Part of the `hub_city` business key.
        data_tests:
          - not_null
      - name: franchise_first_name
        description: First name of the franchisee (PII).
      - name: franchise_last_name
        description: Last name of the franchisee (PII).
      - name: franchise_email
        description: Email address of the franchisee (PII).
      - name: franchise_phone
        description: Phone number of the franchisee (PII).
      - name: franchise_pii_hashdiff
        description: Hashdiff over the PII attributes (email, names, phone).
        data_tests:
          - not_null
      - name: record_source
        description: Source table the row comes from.
        data_tests:
          - not_null
