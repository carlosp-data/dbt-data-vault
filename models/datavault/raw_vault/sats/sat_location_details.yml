version: 2

models:
  - name: sat_location_details
    description: >
      Descriptive attributes of selling locations. One row per location and change.
      Grain: (`location_hk`, `load_dts`). City and country are in `lnk_location_city`,
      and the country code is a city attribute in `sat_city_details`.
      Loaded from `stg_raw__locations`. Insert-only, built with the `sat` macro.
      Includes the ghost record (NULL payload).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['location_hk', 'load_dts']
    columns:
      - name: location_hk
        description: Hash key of the parent location. All zeros for the ghost record.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('hub_location')
                field: location_hk
      - name: load_dts
        description: Load timestamp of the batch that inserted this version. 1900-01-01 for the ghost record.
        data_tests:
          - not_null
      - name: location_details_hashdiff
        description: Hashdiff over the payload columns. All zeros for the ghost record.
        data_tests:
          - not_null
      - name: placekey
        description: Placekey (global point-of-interest identifier) of the location.
      - name: location_name
        description: Name of the location (venue, street or landmark).
      - name: location_region
        description: Region, state or province of the location.
      - name: record_source
        description: Source table of this version. 'SYSTEM' for the ghost record.
        data_tests:
          - not_null
